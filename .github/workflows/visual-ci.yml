name: Visual CI

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Godot download and display stack
        run: |
          echo "runner: $(uname -a)"
          which xvfb-run || true
          ls /usr/lib/x86_64-linux-gnu/dri 2>/dev/null | head
          curl -sL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -o -q /tmp/godot.zip -d /tmp/godot
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --version
      - name: Write probe result
        run: |
          mkdir -p docs/visual-ci
          date -u +"%Y-%m-%dT%H:%M:%SZ" > docs/visual-ci/last-probe.txt
          echo "ok" >> docs/visual-ci/last-probe.txt
      - name: Commit probe
        run: |
          git config user.name "visual-ci"
          git config user.email "visual-ci@users.noreply.github.com"
          git add docs/visual-ci/last-probe.txt
          git commit -m "chore(ci): visual pipeline probe [skip ci]"
          git push
