name: Visual CI

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

concurrency:
  group: visual-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers mesa-utils libgl1-mesa-dri libglx-mesa0
      - name: Download Godot 4.3
        run: |
          curl -sL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -o -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --version
      - name: Import project
        run: |
          timeout 300 /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --import 2>&1 | tee import.log
      - name: Inspect scene
        run: |
          timeout 180 /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --quit-after 3000 res://tools/InspectScene.tscn 2>&1 | tee inspect.log
      - name: Run headless tests
        run: |
          timeout 900 /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . \
            --quit-after 200000 res://tests/TestRunner.tscn 2>&1 | tee tests.log
      - name: Capture screenshots
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1080x1700x24" \
            env __GL_SYNC_TO_VBLANK=0 \
            timeout 900 /tmp/godot/Godot_v4.3-stable_linux.x86_64 --path . \
            --quit-after 4000 --rendering-driver vulkan --rendering-method mobile \
            --resolution 720x1280 res://tools/CaptureLevel.tscn 2>&1 | tee capture.log
        env:
          GIOCO_DEBUG: "1"
      - name: Publish results
        if: always()
        run: |
          mkdir -p docs/visual-ci
          cp import.log docs/visual-ci/import.log 2>/dev/null || true
          cp inspect.log docs/visual-ci/inspect.log 2>/dev/null || true
          cp tests.log docs/visual-ci/tests.log 2>/dev/null || true
          cp capture.log docs/visual-ci/capture.log 2>/dev/null || true
          git config user.name "visual-ci"
          git config user.email "visual-ci@users.noreply.github.com"
          git add docs/screenshots docs/visual-ci
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
            exit 0
          fi
          git commit -m "chore(visual): screenshot e log della scena [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 4
          done
